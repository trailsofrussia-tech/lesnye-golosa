<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#263a2a">
  <title>Лесные голоса — аудиопульт</title>
  <style>
    :root{--ink:#1d261d;--muted:#6d7569;--paper:#f2efe5;--card:#fbfaf5;--moss:#3d533d;--dark:#263a2a;--fern:#7b9068;--line:rgba(35,51,36,.14)}
    *{box-sizing:border-box}html{background:var(--paper)}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 12% 3%,rgba(144,164,120,.22),transparent 30rem),linear-gradient(180deg,#f6f3e9 0%,var(--paper) 40%,#ebe8dc 100%);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:60px 0 40px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:32px}.eyebrow{color:var(--moss);font-size:12px;font-weight:800;letter-spacing:.18em;margin:0 0 12px;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:clamp(48px,8vw,88px);font-weight:500;letter-spacing:-.055em;line-height:.92;margin:0}.intro{color:var(--muted);font-size:15px;line-height:1.55;margin:20px 0 0;max-width:620px}.auto{align-items:center;color:var(--dark);cursor:pointer;display:flex;flex:0 0 auto;font-size:13px;font-weight:700;gap:10px}.auto input{height:1px;opacity:0;position:absolute;width:1px}.switch{background:#c4c9bd;border-radius:99px;height:24px;padding:3px;width:42px}.switch:after{background:#fff;border-radius:50%;box-shadow:0 1px 4px #0003;content:"";display:block;height:18px;transition:transform .16s;width:18px}.auto input:checked+.switch{background:var(--moss)}.auto input:checked+.switch:after{transform:translateX(18px)}.now{background:var(--dark);border-radius:24px;box-shadow:0 18px 45px rgba(35,49,37,.17);color:#f8f5ea;display:grid;grid-template-columns:1fr auto;margin-bottom:56px;padding:26px 28px 22px}.status{align-items:center;display:flex;gap:14px}.pulse{background:#81917d;border:5px solid #ffffff17;border-radius:50%;height:18px;width:18px}.pulse.on{animation:pulse 1.7s infinite;background:#d7e49f}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(215,228,159,0)}0%,100%{box-shadow:0 0 0 0 rgba(215,228,159,.28)}}.status-label{color:#acb9aa;font-size:11px;font-weight:800;letter-spacing:.13em;margin:0 0 4px;text-transform:uppercase}.status h2{font-family:Georgia,serif;font-size:27px;font-weight:500;margin:0}.transport{align-items:center;display:flex;gap:8px}.transport button{border:0;cursor:pointer}.round,.main-play{align-items:center;border-radius:50%;display:inline-flex;justify-content:center}.round{background:#ffffff1a;color:#fff;font-family:Georgia,serif;font-size:30px;height:42px;width:42px}.main-play{background:#e5eebd;color:var(--dark);font-size:15px;height:52px;margin:0 3px;padding-left:3px;width:52px}.stop{background:transparent;color:#b9c3b6;font-size:12px;font-weight:700;margin-left:6px;padding:10px}.transport button:disabled{cursor:not-allowed;opacity:.35}.timeline{align-items:center;display:grid;gap:12px;grid-column:1/-1;grid-template-columns:38px 1fr 38px;margin-top:20px}.timeline span{color:#aab6a7;font-size:11px;font-variant-numeric:tabular-nums}.active-volume{color:#849181;font-size:10px;grid-column:1/-1;margin:9px 50px 0}input[type=range]{appearance:none;background:linear-gradient(to right,var(--fern) var(--value,0%),#d5d8d0 var(--value,0%));border-radius:99px;cursor:pointer;height:5px;width:100%}.timeline input{background:linear-gradient(to right,#dfe9ab var(--value,0%),#ffffff2e var(--value,0%))}input[type=range]::-webkit-slider-thumb{appearance:none;background:var(--moss);border:3px solid #fff;border-radius:50%;box-shadow:0 1px 4px #0004;height:18px;width:18px}.timeline input::-webkit-slider-thumb{background:#dfe9ab;border-color:var(--dark)}.groups{display:grid;gap:48px}.group{display:grid;gap:22px;grid-template-columns:180px 1fr}.group-head{align-self:start;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;padding-top:14px}.group-head>span{color:var(--fern);font-size:10px;font-weight:800;letter-spacing:.12em;margin-right:10px}.group-head h2{font-family:Georgia,serif;font-size:22px;font-weight:500;line-height:1;margin:0}.group-head small{align-items:center;background:#3d533d1a;border-radius:50%;color:var(--moss);display:flex;font-size:10px;height:22px;justify-content:center;width:22px}.track-list{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}.card{align-items:center;background:#fbfaf5c4;border:1px solid var(--line);border-radius:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(145px,.7fr);min-height:88px;padding:13px 16px 13px 13px}.card.active{background:#e7ebd8;border-color:#3d533d61;box-shadow:inset 3px 0 0 var(--moss)}.track-play{align-items:center;background:transparent;border:0;color:var(--ink);cursor:pointer;display:flex;gap:12px;min-width:0;padding:0;text-align:left}.symbol{align-items:center;background:var(--moss);border-radius:50%;color:#fff;display:flex;flex:0 0 auto;font-size:10px;height:40px;justify-content:center;padding-left:2px;width:40px}.track-play strong,.track-play small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track-play strong{font-family:Georgia,serif;font-size:17px;margin-bottom:5px}.track-play small{color:var(--muted);font-size:10px}.volume{align-items:center;display:grid;gap:8px;grid-template-columns:1fr 34px}.volume>span{color:var(--muted);font-size:9px;grid-column:1/-1;letter-spacing:.08em;text-transform:uppercase}.volume output{color:var(--moss);font-size:10px;text-align:right}footer{border-top:1px solid var(--line);color:var(--muted);font-size:11px;margin-top:64px;padding-top:20px;text-align:center}
    @media(max-width:880px){.hero{align-items:flex-start;flex-direction:column;gap:22px}.group{grid-template-columns:1fr}.group-head{grid-template-columns:auto auto 1fr}.group-head small{justify-self:end}}
    @media(max-width:680px){.shell{padding:max(28px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));width:100%}.hero{gap:18px;margin-bottom:28px}.intro{font-size:14px}.auto{min-height:44px}.now{border-radius:19px;grid-template-columns:1fr;margin-bottom:38px;padding:20px 14px 16px}.status h2{font-size:24px}.transport{flex-wrap:wrap;justify-content:center;margin-top:20px}.round{height:46px;width:46px}.main-play{height:54px;width:54px}.stop{min-height:44px}.timeline{gap:8px;grid-template-columns:34px minmax(0,1fr) 34px}.active-volume{margin-inline:42px}.track-list{grid-template-columns:1fr}.card{grid-template-columns:minmax(0,1fr) minmax(130px,.7fr)}input[type=range]{height:7px}input[type=range]::-webkit-slider-thumb{height:24px;width:24px}footer{line-height:1.5;margin-top:48px}}
    @media(max-width:420px){h1{font-size:clamp(42px,12.5vw,48px)}.eyebrow{font-size:10px}.card{gap:10px;grid-template-columns:1fr;padding:13px}.volume{padding:2px 4px 4px 54px}}
  </style>
</head>
<body>
  <main class="shell">
    <audio id="audio" preload="metadata"></audio>
    <header class="hero"><div><p class="eyebrow">Аудиопульт · 17 записей</p><h1>Лесные голоса</h1><p class="intro">Нажмите на трек, чтобы включить его. Новый трек заменит текущий, а выбранная громкость сохранится для каждой записи.</p></div><label class="auto"><input id="autoNext" type="checkbox" checked><span class="switch"></span>Следующий автоматически</label></header>
    <section class="now" aria-label="Текущий трек"><div class="status"><span id="pulse" class="pulse"></span><div><p id="statusLabel" class="status-label">Плеер готов</p><h2 id="currentTitle">Выберите запись</h2></div></div><div class="transport"><button id="prev" class="round" aria-label="Предыдущий трек">‹</button><button id="mainPlay" class="main-play" aria-label="Воспроизвести">▶</button><button id="next" class="round" aria-label="Следующий трек">›</button><button id="stop" class="stop">■ Стоп</button></div><div class="timeline"><span id="position">0:00</span><input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Позиция воспроизведения"><span id="duration">0:00</span></div><p id="activeVolume" class="active-volume">Громкость текущего трека: 82%</p></section>
    <div id="groups" class="groups"></div>
    <footer>Порядок: Лес → Русалка → Баюн → Боровичок → Медведь → Яга</footer>
  </main>
  <script>
  (()=>{
    const groups=[
      {name:'Лес',nums:[1],slug:'les'},
      {name:'Русалка',nums:[0,1,2],slug:'rusalka'},
      {name:'Баюн',nums:[0,1,2,3,4],slug:'bayun'},
      {name:'Боровичок',nums:[0,1,2,3],slug:'borovichok'},
      {name:'Медведь',nums:[0,1,2],slug:'medved'},
      {name:'Яга',nums:[1],slug:'yaga'}
    ];
    const tracks=groups.flatMap(g=>g.nums.map(n=>({id:`${g.slug}-${n}`,name:g.name,num:n,src:`audio/${g.slug}-${n}.mp3`})));
    const audio=document.querySelector('#audio'),mainPlay=document.querySelector('#mainPlay'),stopBtn=document.querySelector('#stop'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),seek=document.querySelector('#seek'),position=document.querySelector('#position'),duration=document.querySelector('#duration'),pulse=document.querySelector('#pulse'),statusLabel=document.querySelector('#statusLabel'),currentTitle=document.querySelector('#currentTitle'),activeVolume=document.querySelector('#activeVolume'),autoNext=document.querySelector('#autoNext');
    let active=-1; const fallback=.82; let volumes={};
    try{volumes={...JSON.parse(localStorage.getItem('forest-player-volumes')||'{}')}}catch{}
    tracks.forEach(t=>{if(typeof volumes[t.id]!=='number')volumes[t.id]=fallback});
    const fmt=v=>Number.isFinite(v)?`${Math.floor(v/60)}:${String(Math.floor(v%60)).padStart(2,'0')}`:'0:00';
    const save=()=>{try{localStorage.setItem('forest-player-volumes',JSON.stringify(volumes))}catch{}};
    function render(){document.querySelectorAll('.card').forEach((card,i)=>{const on=i===active,playing=on&&!audio.paused;card.classList.toggle('active',on);card.querySelector('.symbol').textContent=playing?'Ⅱ':'▶';card.querySelector('.hint').textContent=playing?'Воспроизводится':on?'На паузе':'Нажмите, чтобы включить';card.querySelector('.track-play').setAttribute('aria-label',`${playing?'Пауза':'Воспроизвести'}: ${tracks[i].name} ${tracks[i].num}`)});const playing=active>=0&&!audio.paused;pulse.classList.toggle('on',playing);statusLabel.textContent=playing?'Сейчас звучит':'Плеер готов';currentTitle.textContent=active>=0?`${tracks[active].name} ${tracks[active].num}`:'Выберите запись';mainPlay.textContent=playing?'Ⅱ':'▶';mainPlay.setAttribute('aria-label',playing?'Пауза':'Воспроизвести');prev.disabled=active===0;next.disabled=active===tracks.length-1;stopBtn.disabled=active<0;activeVolume.textContent=`Громкость текущего трека: ${Math.round((active>=0?volumes[tracks[active].id]:fallback)*100)}%`}
    function start(i){if(!tracks[i])return;if(active!==i){active=i;audio.src=tracks[i].src;audio.currentTime=0;audio.volume=volumes[tracks[i].id];seek.value=0;position.textContent='0:00'}audio.play().catch(()=>render());render()}
    function toggle(i){if(active===i&&!audio.paused)audio.pause();else start(i);render()}
    document.querySelector('#groups').innerHTML=groups.map((g,gi)=>`<section class="group"><div class="group-head"><span>${String(gi+1).padStart(2,'0')}</span><h2>${g.name}</h2><small>${g.nums.length}</small></div><div class="track-list">${g.nums.map(n=>{const i=tracks.findIndex(t=>t.id===`${g.slug}-${n}`),t=tracks[i],v=volumes[t.id];return `<article class="card" data-index="${i}"><button class="track-play" aria-label="Воспроизвести: ${g.name} ${n}"><span class="symbol">▶</span><span><strong>${g.name} ${n}</strong><small class="hint">Нажмите, чтобы включить</small></span></button><label class="volume"><span>Громкость</span><input type="range" min="0" max="1" step=".01" value="${v}" style="--value:${v*100}%" aria-label="Громкость: ${g.name} ${n}"><output>${Math.round(v*100)}%</output></label></article>`}).join('')}</div></section>`).join('');
    document.querySelectorAll('.card').forEach(card=>{const i=Number(card.dataset.index),slider=card.querySelector('input'),out=card.querySelector('output');card.querySelector('.track-play').addEventListener('click',()=>toggle(i));slider.addEventListener('input',()=>{const v=Number(slider.value);volumes[tracks[i].id]=v;slider.style.setProperty('--value',`${v*100}%`);out.textContent=`${Math.round(v*100)}%`;if(active===i)audio.volume=v;save();render()})});
    mainPlay.addEventListener('click',()=>active<0?start(0):toggle(active));stopBtn.addEventListener('click',()=>{audio.pause();audio.currentTime=0;render()});prev.addEventListener('click',()=>start(Math.max(0,active<0?0:active-1)));next.addEventListener('click',()=>start(Math.min(tracks.length-1,active<0?0:active+1)));seek.addEventListener('input',()=>{audio.currentTime=Number(seek.value)});audio.addEventListener('loadedmetadata',()=>{seek.max=audio.duration||0;duration.textContent=fmt(audio.duration)});audio.addEventListener('timeupdate',()=>{seek.value=audio.currentTime;seek.style.setProperty('--value',`${audio.duration?audio.currentTime/audio.duration*100:0}%`);position.textContent=fmt(audio.currentTime)});audio.addEventListener('play',render);audio.addEventListener('pause',render);audio.addEventListener('ended',()=>{if(autoNext.checked&&active<tracks.length-1)start(active+1);else render()});
    render();
  })();
  </script>
</body>
</html>
